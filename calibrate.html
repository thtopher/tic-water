<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspot Calibration Tool</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .toolbar h2 {
      font-size: 0.9rem;
      color: #e94560;
      margin-right: 0.5rem;
    }
    .toolbar .info {
      font-size: 0.78rem;
      color: #8892b0;
      flex: 1;
    }
    .toolbar button {
      background: #e94560;
      color: white;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .toolbar button:hover { background: #c73a52; }
    .toolbar button.secondary {
      background: #0f3460;
    }
    .toolbar button.secondary:hover { background: #1a4a7a; }

    .canvas-wrapper {
      margin-top: 56px;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    .canvas {
      position: relative;
      display: inline-block;
      border: 2px solid #0f3460;
      border-radius: 8px;
      overflow: hidden;
    }
    .canvas img {
      display: block;
      width: calc(100vw - 2rem);
      max-width: 1800px;
      height: auto;
    }

    /* Hotspot boxes */
    .box {
      position: absolute;
      border: 2px solid #e94560;
      background: rgba(233, 69, 96, 0.12);
      cursor: move;
      border-radius: 6px;
      user-select: none;
      transition: background 0.15s;
    }
    .box:hover, .box.dragging {
      background: rgba(233, 69, 96, 0.22);
    }
    .box.selected {
      border-color: #00d2ff;
      background: rgba(0, 210, 255, 0.15);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
    }
    .box .label {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #e94560;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      white-space: nowrap;
    }
    .box.selected .label { color: #00d2ff; }

    /* Resize handle */
    .box .resize {
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 14px;
      height: 14px;
      background: #e94560;
      border-radius: 3px;
      cursor: nwse-resize;
    }
    .box.selected .resize { background: #00d2ff; }

    /* Coords display */
    .coords {
      position: absolute;
      bottom: 4px;
      left: 6px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.7);
      pointer-events: none;
      font-family: 'SF Mono', 'Monaco', monospace;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Export modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 {
      color: #e94560;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }
    .modal pre {
      background: #0a0a1a;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.78rem;
      color: #00d2ff;
      white-space: pre-wrap;
      line-height: 1.6;
      font-family: 'SF Mono', 'Monaco', monospace;
    }
    .modal button {
      margin-top: 1rem;
      background: #e94560;
      color: white;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <h2>CALIBRATE</h2>
  <span class="info">Drag boxes to position. Drag bottom-right handle to resize. Click "Export" when done.</span>
  <button class="secondary" onclick="resetAll()">Reset</button>
  <button onclick="exportCoords()">Export Coordinates</button>
</div>

<div class="canvas-wrapper">
  <div class="canvas" id="canvas">
    <img src="water-treatment2.png" alt="Diagram" draggable="false" />
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Hotspot Coordinates</h3>
    <p style="font-size:0.8rem; color:#8892b0; margin-bottom:0.75rem;">Copy this and paste it back to me. These are the exact positions.</p>
    <pre id="exportOutput"></pre>
    <button onclick="document.getElementById('modal').classList.remove('visible')">Close</button>
  </div>
</div>

<script>
const stageNames = [
  '1) Water Intake',
  '2) Coagulation',
  '3) Sedimentation',
  '4) Filtration',
  '5) Disinfection',
  '6) Storage',
  '7) Distribution'
];

// Starting positions (current best guesses — percentage of image)
const defaults = [
  { left: 12.0, top: 4.1, width: 8.2, height: 39.8 },
  { left: 27.5, top: 2.2, width: 12.0, height: 41.7 },
  { left: 44.2, top: 4.1, width: 14.2, height: 39.8 },
  { left: 67.9, top: 2.2, width: 14.8, height: 42.4 },
  { left: 66.3, top: 46.1, width: 16.4, height: 49.1 },
  { left: 47.3, top: 46.1, width: 13.6, height: 49.1 },
  { left: 26.2, top: 43.9, width: 14.8, height: 51.3 },
];

const canvas = document.getElementById('canvas');
const boxes = [];
let selectedBox = null;

function createBoxes() {
  defaults.forEach((pos, i) => {
    const box = document.createElement('div');
    box.className = 'box';
    box.dataset.index = i;
    box.innerHTML = `
      <span class="label">${stageNames[i]}</span>
      <span class="coords"></span>
      <div class="resize"></div>
    `;
    canvas.appendChild(box);
    boxes.push({ el: box, ...pos });
    applyPosition(i);
    setupDrag(box, i);
    setupResize(box.querySelector('.resize'), i);
    box.addEventListener('mousedown', () => selectBox(i));
  });
}

function selectBox(i) {
  boxes.forEach((b, idx) => b.el.classList.toggle('selected', idx === i));
  selectedBox = i;
}

function applyPosition(i) {
  const b = boxes[i];
  b.el.style.left = b.left + '%';
  b.el.style.top = b.top + '%';
  b.el.style.width = b.width + '%';
  b.el.style.height = b.height + '%';
  b.el.querySelector('.coords').textContent =
    `L:${b.left.toFixed(1)} T:${b.top.toFixed(1)} W:${b.width.toFixed(1)} H:${b.height.toFixed(1)}`;
}

function setupDrag(el, i) {
  let startX, startY, startLeft, startTop;

  el.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('resize')) return;
    e.preventDefault();
    el.classList.add('dragging');
    const rect = canvas.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    startLeft = boxes[i].left;
    startTop = boxes[i].top;

    function onMove(e) {
      const dx = (e.clientX - startX) / rect.width * 100;
      const dy = (e.clientY - startY) / rect.height * 100;
      boxes[i].left = Math.max(0, Math.min(100 - boxes[i].width, startLeft + dx));
      boxes[i].top = Math.max(0, Math.min(100 - boxes[i].height, startTop + dy));
      applyPosition(i);
    }
    function onUp() {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function setupResize(handle, i) {
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const rect = canvas.getBoundingClientRect();
    const startX = e.clientX;
    const startY = e.clientY;
    const startW = boxes[i].width;
    const startH = boxes[i].height;

    function onMove(e) {
      const dx = (e.clientX - startX) / rect.width * 100;
      const dy = (e.clientY - startY) / rect.height * 100;
      boxes[i].width = Math.max(3, startW + dx);
      boxes[i].height = Math.max(3, startH + dy);
      applyPosition(i);
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function resetAll() {
  defaults.forEach((pos, i) => {
    boxes[i].left = pos.left;
    boxes[i].top = pos.top;
    boxes[i].width = pos.width;
    boxes[i].height = pos.height;
    applyPosition(i);
  });
}

function exportCoords() {
  const lines = boxes.map((b, i) => {
    return `${stageNames[i]}:  left: ${b.left.toFixed(1)}%; top: ${b.top.toFixed(1)}%; width: ${b.width.toFixed(1)}%; height: ${b.height.toFixed(1)}%;`;
  });
  document.getElementById('exportOutput').textContent = lines.join('\n');
  document.getElementById('modal').classList.add('visible');
}

createBoxes();
</script>

</body>
</html>
